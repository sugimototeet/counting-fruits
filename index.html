<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff7d7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="かぞえよう">
  <link rel="manifest" href="manifest.json">
  <title>くだもの かぞえよう</title>
  <style>
    :root {
      --bg: #fff7d7;
      --ink: #3b2b1f;
      --green: #55b86f;
      --green-dark: #2d8e4d;
      --orange: #ffb347;
      --pink: #ff7aa8;
      --blue: #6eb6ff;
      --white: #fffef7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 15%, #ffe891 0 14%, transparent 15%),
        radial-gradient(circle at 85% 20%, #c8f3d5 0 12%, transparent 13%),
        linear-gradient(180deg, #fff4bf 0%, var(--bg) 48%, #e7f9d9 100%);
    }

    button {
      font: inherit;
      border: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      width: min(980px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 18px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 14px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 5vw, 3.2rem);
      letter-spacing: 0;
    }

    .score {
      min-width: 108px;
      padding: 10px 14px;
      border-radius: 999px;
      background: var(--white);
      box-shadow: 0 5px 0 rgba(80, 55, 30, .16);
      text-align: center;
      font-size: clamp(1rem, 3vw, 1.35rem);
      font-weight: 800;
    }

    main {
      display: grid;
      align-content: center;
      gap: 20px;
    }

    .prompt {
      margin: 0;
      text-align: center;
      font-size: clamp(1.45rem, 5vw, 2.5rem);
      font-weight: 900;
    }

    .fruit-area {
      min-height: 260px;
      padding: clamp(16px, 4vw, 28px);
      border-radius: 28px;
      background: rgba(255, 254, 247, .74);
      box-shadow: inset 0 0 0 4px rgba(255, 255, 255, .8), 0 10px 0 rgba(86, 66, 24, .12);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(84px, 1fr));
      place-items: center;
      gap: clamp(10px, 3vw, 18px);
    }

    .fruit {
      width: clamp(70px, 16vw, 116px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 28px;
      background: #ffffff;
      box-shadow: 0 7px 0 rgba(75, 49, 20, .13);
      font-size: clamp(3.2rem, 11vw, 5.5rem);
      animation: pop .38s ease both;
      user-select: none;
    }

    .fruit:nth-child(2n) {
      transform: rotate(4deg);
    }

    .fruit:nth-child(3n) {
      transform: rotate(-4deg);
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(10px, 3vw, 18px);
    }

    .choice {
      min-height: clamp(86px, 18vw, 132px);
      border-radius: 24px;
      color: #2e2117;
      background: var(--orange);
      box-shadow: 0 9px 0 #d48326;
      font-size: clamp(1.6rem, 6vw, 3.1rem);
      font-weight: 1000;
      transition: transform .12s ease, box-shadow .12s ease, background .2s ease;
    }

    .choice:nth-child(2) {
      background: var(--pink);
      box-shadow: 0 9px 0 #c94d78;
    }

    .choice:nth-child(3) {
      background: var(--blue);
      box-shadow: 0 9px 0 #3a83c9;
    }

    .choice:active {
      transform: translateY(5px);
      box-shadow: 0 4px 0 rgba(50, 40, 20, .25);
    }

    .choice.correct {
      color: #fff;
      background: var(--green);
      box-shadow: 0 9px 0 var(--green-dark);
      animation: happy .45s ease both;
    }

    .choice.wrong {
      animation: shake .28s ease both;
    }

    .message {
      min-height: 52px;
      display: grid;
      place-items: center;
      text-align: center;
      font-size: clamp(1.3rem, 4vw, 2rem);
      font-weight: 900;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding-bottom: 4px;
    }

    .small-button {
      padding: 12px 18px;
      border-radius: 999px;
      background: #ffffff;
      color: var(--ink);
      box-shadow: 0 5px 0 rgba(80, 55, 30, .16);
      font-size: 1rem;
      font-weight: 800;
    }

    @keyframes pop {
      0% { opacity: 0; transform: scale(.55); }
      75% { transform: scale(1.08); }
      100% { opacity: 1; }
    }

    @keyframes happy {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-8px) scale(1.05); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }

    @media (max-width: 560px) {
      .app {
        padding: 12px;
      }

      header {
        align-items: flex-start;
      }

      .fruit-area {
        min-height: 230px;
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .choices {
        grid-template-columns: 1fr;
      }

      .choice {
        min-height: 78px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>くだもの かぞえよう</h1>
      <div class="score" aria-live="polite">できた 0</div>
    </header>

    <main>
      <p class="prompt" id="prompt">りんごは いくつ？</p>
      <section class="fruit-area" id="fruitArea" aria-label="かぞえるくだもの"></section>
      <section class="choices" id="choices" aria-label="こたえ"></section>
      <div class="message" id="message" aria-live="polite">かぞえて えらんでね</div>
    </main>

    <div class="controls">
      <button class="small-button" id="nextButton" type="button">つぎ</button>
      <button class="small-button" id="soundButton" type="button" aria-pressed="true">おと あり</button>
    </div>
  </div>

  <script>
    const fruits = [
      { name: "りんご", emoji: "🍎" },
      { name: "みかん", emoji: "🍊" },
      { name: "いちご", emoji: "🍓" },
      { name: "バナナ", emoji: "🍌" },
      { name: "ぶどう", emoji: "🍇" }
    ];

    const promptEl = document.querySelector("#prompt");
    const fruitArea = document.querySelector("#fruitArea");
    const choicesEl = document.querySelector("#choices");
    const messageEl = document.querySelector("#message");
    const scoreEl = document.querySelector(".score");
    const nextButton = document.querySelector("#nextButton");
    const soundButton = document.querySelector("#soundButton");

    let answer = 6;
    let score = 0;
    let locked = false;
    let soundOn = true;
    let audioContext;

    function pick(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    function shuffle(list) {
      return [...list].sort(() => Math.random() - 0.5);
    }

    function playTone(type) {
      if (!soundOn) return;
      audioContext ||= new (window.AudioContext || window.webkitAudioContext)();

      const now = audioContext.currentTime;
      const gain = audioContext.createGain();
      gain.connect(audioContext.destination);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.16, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);

      const tones = type === "correct" ? [523.25, 659.25, 783.99] : [220, 185];
      tones.forEach((frequency, index) => {
        const osc = audioContext.createOscillator();
        osc.type = "sine";
        osc.frequency.setValueAtTime(frequency, now + index * 0.08);
        osc.connect(gain);
        osc.start(now + index * 0.08);
        osc.stop(now + index * 0.08 + 0.1);
      });
    }

    function makeChoices(count) {
      const low = Math.max(1, count - 1);
      const high = Math.min(9, count + 1);
      const options = new Set([count, low, high]);

      while (options.size < 3) {
        options.add(Math.floor(Math.random() * 8) + 2);
      }

      return shuffle([...options]).slice(0, 3);
    }

    function newQuestion() {
      locked = false;
      const fruit = pick(fruits);
      answer = Math.floor(Math.random() * 5) + 3;
      promptEl.textContent = `${fruit.name}は いくつ？`;
      messageEl.textContent = "かぞえて えらんでね";
      fruitArea.innerHTML = "";
      choicesEl.innerHTML = "";

      for (let i = 0; i < answer; i += 1) {
        const item = document.createElement("div");
        item.className = "fruit";
        item.textContent = fruit.emoji;
        item.style.animationDelay = `${i * 45}ms`;
        fruitArea.append(item);
      }

      makeChoices(answer).forEach((number) => {
        const button = document.createElement("button");
        button.className = "choice";
        button.type = "button";
        button.textContent = `${number}こ`;
        button.addEventListener("click", () => checkAnswer(button, number));
        choicesEl.append(button);
      });
    }

    function checkAnswer(button, number) {
      if (locked) return;

      if (number === answer) {
        locked = true;
        score += 1;
        scoreEl.textContent = `できた ${score}`;
        button.classList.add("correct");
        messageEl.textContent = "せいかい！";
        playTone("correct");
        setTimeout(newQuestion, 1200);
        return;
      }

      button.classList.remove("wrong");
      void button.offsetWidth;
      button.classList.add("wrong");
      messageEl.textContent = "もういちど";
      playTone("wrong");
    }

    nextButton.addEventListener("click", newQuestion);
    soundButton.addEventListener("click", () => {
      soundOn = !soundOn;
      soundButton.textContent = soundOn ? "おと あり" : "おと なし";
      soundButton.setAttribute("aria-pressed", String(soundOn));
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("service-worker.js").catch(() => {});
      });
    }

    newQuestion();
  </script>
</body>
</html>
